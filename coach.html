<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#006400">
<title>Coach Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="team.js"></script>
<script>
  (function () {
    var T = window.TEAM = Object.assign({ school: 'Cleveland', mascot: 'Warriors', primary: '#006400', accent: '#FFD700', trackingUrl: '', seasonStart: '' }, window.TEAM || {});
    T.fullName = (T.school + ' ' + T.mascot).trim();
    function hex(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join(''); var n = parseInt(h, 16); return isNaN(n) ? [0, 100, 0] : [n >> 16 & 255, n >> 8 & 255, n & 255]; }
    function lum(c) { var v = hex(c).map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; }
    function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    // White text on the team color when it reads well enough, else near-black
    window.TEAM_ON_PRIMARY = contrast(T.primary, '#ffffff') >= 4.5 ? '#FFFFFF' : '#17201A';
  })();
</script>
<style>
  :root {
    --primary: #006400; --accent: #FFD700; --on-primary: #FFFFFF;
    --ink: #17201A; --ink-2: #45524A; --muted: #66726B; --line: #DCE3DE; --surface: #FFFFFF; --page: #F3F6F4;
    --red: #B42318; --red-bg: #FEE4E2; --orange: #B54708; --orange-bg: #FEF0C7; --green: #067647; --green-bg: #DCFAE6;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .gate { max-width: 440px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .gate h2 { font-size: 20px; margin: 0 0 6px; }
  .gate p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
  .gate label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .gate input { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; }
  .gate .btn { width: 100%; justify-content: center; margin-top: 12px; background: var(--primary); color: var(--on-primary); }
  .gate .err { color: var(--red); font-weight: 600; font-size: 14px; margin-top: 10px; }
  .notice { max-width: 560px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .notice h2 { font-size: 18px; margin: 0 0 6px; }
  .notice p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; font-size: 12px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header.top { background: var(--primary); color: var(--on-primary); padding-top: env(safe-area-inset-top, 0px); }
  header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; padding-bottom: 18px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.15; font-weight: 800; }
  .sub { font-size: 14px; opacity: .92; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 700; }
  .btn-light { background: rgba(255,255,255,.16); color: inherit; border: 1px solid rgba(255,255,255,.45); }
  .btn-light:hover { background: rgba(255,255,255,.26); }
  .btn-plain { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .btn-plain:hover { border-color: var(--primary); }
  main.wrap { padding-top: 20px; padding-bottom: 40px; }
  section { margin-bottom: 26px; }
  h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 13px; font-weight: 700; background: var(--line); color: var(--ink-2); padding: 1px 8px; border-radius: 99px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .tile .val { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .val small { font-size: 16px; font-weight: 700; color: var(--muted); }
  .tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left-width: 1px; border-radius: var(--radius); padding: 12px 14px; }
  .alert:hover { border-color: var(--ink-2); }
  .alert .ic { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .alert .who { font-weight: 700; }
  .alert .what { font-size: 14px; color: var(--ink-2); }
  .alert .when { margin-left: auto; flex-shrink: 0; font-size: 12px; color: var(--muted); white-space: nowrap; padding-left: 8px; }
  .k-red .ic { background: var(--red-bg); color: var(--red); }
  .k-orange .ic { background: var(--orange-bg); color: var(--orange); }
  .k-gray .ic { background: #EEF1EF; color: var(--ink-2); }
  .clear { background: var(--green-bg); color: var(--green); border-radius: var(--radius); padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .pill svg { flex-shrink: 0; }
  .s-red { background: var(--red-bg); color: var(--red); }
  .s-orange { background: var(--orange-bg); color: var(--orange); }
  .s-green { background: var(--green-bg); color: var(--green); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters input[type=search] { flex: 1 1 180px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .filters select { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
  .roster { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: grid; grid-template-columns: minmax(0, 2.2fr) 1.1fr 1fr .8fr 1.6fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
  .row:first-child { border-top: 0; }
  button.row:hover { background: #F7FAF8; }
  .row.head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: #F7FAF8; }
  .nm { font-weight: 700; }
  .meta { font-size: 13px; color: var(--muted); }
  .wk { font-weight: 700; font-variant-numeric: tabular-nums; }
  .wk.missing { color: var(--muted); font-weight: 600; }
  .lastarm { font-size: 13px; color: var(--ink-2); }
  .empty { padding: 20px 16px; color: var(--muted); }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .chart-card p { margin: 0 0 10px; font-size: 14px; color: var(--ink-2); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
  .copybox { margin-top: 8px; width: 100%; min-height: 70px; border-radius: 10px; border: 1px solid var(--line); padding: 8px; font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toast { font-size: 13px; color: var(--green); font-weight: 700; }
  /* Pitcher panel */
  .scrim { position: fixed; inset: 0; background: rgba(15, 23, 18, .45); display: flex; justify-content: flex-end; z-index: 20; }
  .panel { background: var(--page); width: min(640px, 100%); height: 100%; overflow-y: auto; box-shadow: -8px 0 30px rgba(0,0,0,.18); }
  .panel-head { position: sticky; top: 0; z-index: 1; background: var(--primary); color: var(--on-primary); padding: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel-head h3 { margin: 0; font-size: 22px; }
  .panel-body { padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .card h4 { margin: 0 0 10px; font-size: 15px; }
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); font-weight: 600; }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .grid16 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .cell { border-radius: 8px; border: 1px solid var(--line); text-align: center; padding: 6px 2px; font-size: 12px; }
  .cell b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cell.full { background: var(--green-bg); border-color: #A6E9C0; }
  .cell.part { background: #FFF8DB; border-color: #F2DE8C; }
  .cell.flag-orange { box-shadow: inset 0 0 0 2px var(--orange); }
  .cell.flag-red { box-shadow: inset 0 0 0 2px var(--red); }
  .cell.future { opacity: .45; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .timeline li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .timeline .d { flex-shrink: 0; width: 84px; color: var(--muted); font-size: 13px; padding-top: 2px; }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 16px 30px; }
  footer a { color: var(--ink-2); }
  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
    .row.head { display: none; }
    .row .c-wk, .row .c-streak, .row .c-arm { grid-column: 1 / -1; }
    .row .c-wk::before { content: "This week: "; color: var(--muted); font-weight: 600; }
    .row .c-streak::before { content: "Streak: "; color: var(--muted); font-weight: 600; }
    .row .c-status { grid-row: 1; grid-column: 2; justify-self: end; }
    .alert .when { display: none; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <div class="eyebrow" id="team">Pitching</div>
      <h1>Coach Dashboard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button type="button" class="btn btn-light" id="refresh">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      <span>Refresh</span>
    </button>
  </div>
</header>

<div id="gate" class="wrap" hidden>
  <form class="gate" id="gate-form" novalidate>
    <h2>Coach dashboard</h2>
    <p>Enter your coach code once on this phone or computer. It's on the <strong>Coach Access</strong> tab of your check-in sheet.</p>
    <label for="code">Coach code</label>
    <input id="code" name="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" required>
    <button type="submit" class="btn">Open dashboard</button>
    <p class="err" id="gate-err" role="alert"></p>
  </form>
</div>
<div id="loading" class="wrap"><div class="notice"><p>Loading your pitchers…</p></div></div>
<div id="notice" class="wrap" hidden><div class="notice" id="notice-box"></div></div>
<main class="wrap" id="dash" hidden>
  <section aria-labelledby="h-glance">
    <h2 id="h-glance" hidden>At a glance</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section aria-labelledby="h-alerts">
    <h2 id="h-alerts">Needs your attention <span class="count" id="alert-count">0</span></h2>
    <div class="alerts" id="alerts"></div>
  </section>

  <section aria-labelledby="h-roster">
    <h2 id="h-roster">Roster <span class="count" id="roster-count">0</span></h2>
    <div class="filters">
      <label for="q" hidden>Search names</label>
      <input type="search" id="q" placeholder="Search a name">
      <label for="f-grade" hidden>Grade</label>
      <select id="f-grade"><option value="">All grades</option></select>
      <label for="f-role" hidden>Role</label>
      <select id="f-role"><option value="">All roles</option></select>
      <label for="f-goal" hidden>Goal</label>
      <select id="f-goal"><option value="">Any goal</option></select>
    </div>
    <div class="roster" id="roster" role="list"></div>
    <div class="actions" style="margin-top:10px">
      <button type="button" class="btn btn-plain" id="copy-missing">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span id="copy-label">Copy names: not checked in</span>
      </button>
      <span class="toast" id="copy-toast" role="status"></span>
    </div>
    <textarea class="copybox" id="copy-box" hidden readonly aria-label="Names to copy"></textarea>
  </section>

  <section aria-labelledby="h-team">
    <h2 id="h-team">Team completion by week</h2>
    <div class="chart-card">
      <p id="chart-lead"></p>
      <div class="chart" id="chart"></div>
    </div>
  </section>
</main>
<footer id="foot" hidden>
  Reads your check-in sheet live · <a id="sheet-link" href="#" target="_blank" rel="noopener">Open the sheet</a> · <button type="button" class="linkbtn" id="forget">Forget code on this device</button>
</footer>

<div class="scrim" id="scrim" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-name" id="panel"></div>
</div>

<script>
(function () {
  var DAY = 86400000;
  var state = { q: '', grade: '', role: '', goal: '' };
  var lastFocus = null;

  function $(id) { return document.getElementById(id); }
  var T = window.TEAM, DATA = null, KEY_STORE = 'coach-key-v1';
  function getKey() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  function setKey(k) { try { if (k) localStorage.setItem(KEY_STORE, k); else localStorage.removeItem(KEY_STORE); } catch (e) {} }
  // Week of the season from team.js seasonStart, the same way the athlete app counts it
  function seasonInfo() {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(T.seasonStart || '');
    if (!m) return { week: 0, daysToStart: 0 };
    var start = new Date(+m[1], +m[2] - 1, +m[3]), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((today - start) / DAY);
    if (days < 0) return { week: 0, daysToStart: -days };
    return { week: Math.min(16, Math.floor(days / 7) + 1), daysToStart: 0 };
  }
  function show(which) { ['gate', 'loading', 'notice', 'dash', 'foot'].forEach(function (id) { $(id).hidden = which.indexOf(id) < 0; }); $('refresh').hidden = which.indexOf('dash') < 0; }
  $('team').textContent = T.fullName;
  document.title = T.fullName + ' Coach Dashboard';
  document.documentElement.style.setProperty('--primary', T.primary || '#006400');
  document.documentElement.style.setProperty('--on-primary', window.TEAM_ON_PRIMARY || '#FFFFFF');
  function notice(title, msg) { $('notice-box').innerHTML = '<h2>' + esc(title) + '</h2><p>' + msg + '</p><button type="button" class="btn btn-plain" id="retry">Try again</button>'; show(['notice']); $('retry').onclick = function () { load(); }; }
  function load(fromRefresh) {
    var key = getKey();
    if (!T.trackingUrl) { notice('Not connected yet', 'This team\'s app isn\'t linked to a check-in sheet. Add the sheet\'s web app link as <strong>trackingUrl</strong> in team.js.'); return Promise.resolve(); }
    if (!key) { show(['gate']); $('code').focus(); return Promise.resolve(); }
    if (!fromRefresh) show(['loading']);
    return fetch(T.trackingUrl, { method: 'POST', body: JSON.stringify({ type: 'dashboard', key: key }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok && res.data) {
          var s = seasonInfo();
          DATA = res.data; DATA.week = s.week; DATA.daysToStart = s.daysToStart; DATA.weeks = DATA.weeks || 16;
          DATA.team = T.fullName; DATA.primary = T.primary; DATA.accent = T.accent;
          show(['dash', 'foot']); render(); return;
        }
        if (res && res.error === 'unauthorized') { setKey(''); show(['gate']); $('gate-err').textContent = res.message || 'That code doesn\'t match.'; $('code').focus(); return; }
        if (res && res.error === 'locked') { notice('Locked for a few minutes', esc(res.message)); return; }
        notice('Your sheet needs the latest script', 'The check-in sheet answered, but it\'s running an older version of the script that doesn\'t include the dashboard. Paste in the newest <strong>tracking/Code.gs</strong> and deploy a New version (see tracking/SETUP.md).');
      })
      .catch(function () { if (fromRefresh && DATA) throw new Error('offline'); notice('Couldn\'t reach your sheet', 'Check your signal and try again. If you just updated the script, make sure you deployed a <strong>New version</strong>.'); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(isoStr) {
    if (!isoStr) return '';
    var d = new Date(isoStr), days = Math.floor((Date.now() - d.getTime()) / DAY);
    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + ' days ago';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function shortDate(isoStr) { return isoStr ? new Date(isoStr).toLocaleDateString([], { month: 'short', day: 'numeric' }) : ''; }
  function within(isoStr, days) { return isoStr && (Date.now() - new Date(isoStr).getTime()) <= days * DAY; }
  var ICON = {
    alert: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4.5M12 17h.01"/></svg>',
    repeat: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
    clock: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    check: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
    eye: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    bang: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v9M12 19h.01"/></svg>',
    close: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  var STATUS = {
    red: { label: 'Needs attention', cls: 's-red', icon: ICON.bang, rank: 0 },
    orange: { label: 'Watch', cls: 's-orange', icon: ICON.eye, rank: 1 },
    green: { label: 'On track', cls: 's-green', icon: ICON.check, rank: 2 }
  };
  function pill(s) { var x = STATUS[s]; return '<span class="pill ' + x.cls + '">' + x.icon + x.label + '</span>'; }

  // ---------- analysis ----------
  function analyze(d) {
    var W = d.week;
    var list = d.athletes.map(function (a) {
      var r = { a: a, name: a.name, p: a.profile || null, reasons: [] };
      var weeksDone = 0;
      for (var w = 1; w <= Math.max(W, 0); w++) if (a.checks[w]) weeksDone++;
      r.weeksDone = weeksDone;
      r.thisWeek = W >= 1 ? a.checks[W] || null : null;
      // Streak: consecutive weeks with a check-in, ending this week (or last week if not in yet)
      var s = 0, start = r.thisWeek ? W : W - 1;
      for (var w2 = start; w2 >= 1 && a.checks[w2]; w2--) s++;
      r.streak = s;
      // Missed in a row, counting back from last week
      var miss = 0;
      for (var w3 = W - 1; w3 >= 1 && !a.checks[w3]; w3--) miss++;
      r.missed = miss;
      // Arm signals
      var pain7 = a.arm.filter(function (e) { return e.level === 'PAIN' && within(e.at, 7); });
      var sore7 = a.arm.filter(function (e) { return e.level !== 'PAIN' && within(e.at, 7); });
      r.lastArm = a.arm[0] || null;
      var areaWeeks = {};
      a.arm.forEach(function (e) {
        if (W && e.week && e.week < W - 2) return;
        if (!W && !within(e.at, 21)) return;
        String(e.where || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (ar) {
          (areaWeeks[ar] = areaWeeks[ar] || {})[e.week || shortDate(e.at)] = true;
        });
      });
      r.repeat = Object.keys(areaWeeks).filter(function (ar) { return Object.keys(areaWeeks[ar]).length >= 2; });
      r.profilePain = !!(r.p && r.p.painNow === 'Yes');
      if (pain7.length) r.reasons.push({ k: 'red', icon: ICON.alert, what: 'Reported PAIN' + (pain7[0].where ? ': ' + pain7[0].where : '') + (pain7[0].note ? ' · "' + pain7[0].note + '"' : ''), at: pain7[0].at });
      if (r.profilePain) r.reasons.push({ k: 'red', icon: ICON.alert, what: 'Profile says something hurts right now when throwing' + (r.p.armWhere ? ' (' + r.p.armWhere + ')' : ''), at: r.p.at });
      if (r.repeat.length) r.reasons.push({ k: 'orange', icon: ICON.repeat, what: 'Sore in the same spot 2+ weeks: ' + r.repeat.join(', '), at: r.lastArm && r.lastArm.at });
      if (sore7.length && !r.repeat.length) r.reasons.push({ k: 'orange', icon: ICON.eye, what: 'Soreness' + (sore7[0].where ? ': ' + sore7[0].where : '') + (sore7[0].note ? ' · "' + sore7[0].note + '"' : ''), at: sore7[0].at });
      if (W >= 3 && miss >= 2) r.reasons.push({ k: 'gray', icon: ICON.clock, what: weeksDone === 0 ? 'No check-ins yet this season' : 'No check-in for ' + miss + ' weeks in a row', at: null });
      r.status = (pain7.length || r.profilePain) ? 'red' : (r.repeat.length || sore7.length || (W >= 3 && miss >= 2)) ? 'orange' : 'green';
      return r;
    });
    list.sort(function (x, y) { return STATUS[x.status].rank - STATUS[y.status].rank || x.name.localeCompare(y.name); });
    return list;
  }

  // ---------- render ----------
  var LIST = [];
  function phaseOf(w) { return 'Phase ' + Math.min(4, Math.max(1, Math.ceil(w / 4))); }

  function render() {
    var d = DATA, W = d.week;
    document.documentElement.style.setProperty('--primary', d.primary || '#006400');
    document.documentElement.style.setProperty('--on-primary', window.TEAM_ON_PRIMARY || '#FFFFFF');
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', d.primary || '#006400');
    document.documentElement.style.setProperty('--accent', d.accent || '#FFD700');
    $('team').textContent = d.team;
    document.title = d.team + ' Coach Dashboard';
    $('sub').textContent = (W ? 'Week ' + W + ' of ' + d.weeks + ' · ' + phaseOf(W) : d.daysToStart ? 'Week 1 starts in ' + d.daysToStart + ' day' + (d.daysToStart === 1 ? '' : 's') : 'Before Week 1') + ' · Updated ' + d.generatedLabel;
    $('sheet-link').href = d.sheetUrl || '#';
    LIST = analyze(d);

    // Tiles
    var n = LIST.length;
    var inThis = W ? LIST.filter(function (r) { return r.thisWeek; }).length : 0;
    var lastW = W - 1, lastFull = 0, lastIn = 0;
    if (lastW >= 1) LIST.forEach(function (r) { var c = r.a.checks[lastW]; if (c) { lastIn++; if (c.done === 3) lastFull++; } });
    var flags = LIST.filter(function (r) { return r.a.arm.some(function (e) { return within(e.at, 7); }); }).length;
    var profiles = LIST.filter(function (r) { return r.p; }).length;
    var tiles = [
      { lbl: 'Checked in this week', val: W ? inThis + '<small> / ' + n + '</small>' : '–', note: W ? 'Week ' + W + ', due Sunday' : 'Season hasn\'t started' },
      { lbl: 'All 3 done last week', val: lastW >= 1 && n ? Math.round(lastFull / n * 100) + '<small>%</small>' : '–', note: lastW >= 1 ? lastFull + ' of ' + n + ' pitchers, Week ' + lastW : 'After Week 1' },
      { lbl: 'Arm reports, last 7 days', val: String(flags), note: flags === 1 ? '1 pitcher' : flags + ' pitchers' },
      { lbl: 'Pitcher profiles', val: profiles + '<small> / ' + n + '</small>', note: n - profiles ? (n - profiles) + ' still to send' : 'Everyone\'s in' }
    ];
    $('tiles').innerHTML = tiles.map(function (t) { return '<div class="tile"><div class="lbl">' + esc(t.lbl) + '</div><div class="val">' + t.val + '</div><div class="note">' + esc(t.note) + '</div></div>'; }).join('');

    // Alerts
    var alerts = [];
    LIST.forEach(function (r, i) { r.reasons.forEach(function (x) { alerts.push({ r: r, i: i, x: x }); }); });
    var order = { red: 0, orange: 1, gray: 2 };
    alerts.sort(function (a, b) { return order[a.x.k] - order[b.x.k] || (b.x.at || '').localeCompare(a.x.at || ''); });
    $('alert-count').textContent = alerts.length;
    $('alerts').innerHTML = alerts.length ? alerts.map(function (al) {
      var label = al.x.k === 'red' ? 'Pain' : al.x.k === 'orange' ? 'Soreness' : 'Missing check-ins';
      return '<button type="button" class="alert k-' + al.x.k + '" data-open="' + al.i + '"><span class="ic">' + al.x.icon + '</span>' +
        '<span><span class="who">' + esc(al.r.name) + '</span> <span class="meta">· ' + label + '</span><br><span class="what">' + esc(al.x.what) + '</span></span>' +
        (al.x.at ? '<span class="when">' + esc(ago(al.x.at)) + '</span>' : '') + '</button>';
    }).join('') : '<div class="clear">' + ICON.check + '<span>All clear. No pain, repeat soreness or missed check-ins right now.</span></div>';

    // Filters (built once from profiles)
    fillSelect('f-grade', LIST.map(function (r) { return r.p && r.p.grade; }), ['Freshman', 'Sophomore', 'Junior', 'Senior']);
    fillSelect('f-role', LIST.map(function (r) { return r.p && r.p.role; }));
    var goals = []; LIST.forEach(function (r) { if (r.p && r.p.goals) goals = goals.concat(r.p.goals.split(',').map(function (g) { return g.trim(); })); });
    fillSelect('f-goal', goals);
    renderRoster();
    renderChart();
  }

  function fillSelect(id, values, order) {
    var sel = $(id), keep = sel.value, first = sel.options[0].outerHTML;
    var uniq = values.filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; });
    uniq.sort(function (a, b) { if (order) return order.indexOf(a) - order.indexOf(b); return a.localeCompare(b); });
    sel.innerHTML = first + uniq.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('');
    sel.value = uniq.indexOf(keep) >= 0 ? keep : '';
    sel.hidden = !uniq.length;
  }

  function visible() {
    var q = state.q.toLowerCase();
    return LIST.filter(function (r) {
      if (q && r.name.toLowerCase().indexOf(q) < 0) return false;
      if (state.grade && !(r.p && r.p.grade === state.grade)) return false;
      if (state.role && !(r.p && r.p.role === state.role)) return false;
      if (state.goal && !(r.p && (', ' + r.p.goals + ',').indexOf(', ' + state.goal + ',') >= 0)) return false;
      return true;
    });
  }

  function renderRoster() {
    var W = DATA.week, rows = visible();
    $('roster-count').textContent = rows.length === LIST.length ? LIST.length : rows.length + ' of ' + LIST.length;
    var head = '<div class="row head" role="presentation"><span>Pitcher</span><span>Status</span><span>This week</span><span>Streak</span><span>Last arm report</span></div>';
    if (!LIST.length) { $('roster').innerHTML = '<div class="empty">No athletes yet. They show up here after their first check-in or profile.</div>'; return; }
    if (!rows.length) { $('roster').innerHTML = head + '<div class="empty">Nobody matches those filters.</div>'; return; }
    $('roster').innerHTML = head + rows.map(function (r) {
      var i = LIST.indexOf(r), p = r.p;
      var meta = p ? [p.grade, p.throws ? (p.throws === 'Left' ? 'LHP' : 'RHP') : '', p.role].filter(Boolean).join(' · ') : 'No profile yet';
      var wk = !W ? '<span class="wk missing">Not started</span>' : r.thisWeek ? '<span class="wk">' + (r.thisWeek.done === 3 ? 'All 3 done' : r.thisWeek.done + ' of 3') + '</span>' : '<span class="wk missing">Not in yet</span>';
      var la = r.lastArm ? esc((r.lastArm.level === 'PAIN' ? 'Pain' : 'Sore') + (r.lastArm.where ? ', ' + r.lastArm.where : '') + ' · ' + ago(r.lastArm.at)) : 'None';
      return '<button type="button" class="row" role="listitem" data-open="' + i + '">' +
        '<span><span class="nm">' + esc(r.name) + '</span><br><span class="meta">' + esc(meta) + '</span></span>' +
        '<span class="c-status">' + pill(r.status) + '</span>' +
        '<span class="c-wk">' + wk + '</span>' +
        '<span class="c-streak wk">' + r.streak + ' wk' + (r.streak === 1 ? '' : 's') + '</span>' +
        '<span class="c-arm lastarm">' + la + '</span></button>';
    }).join('');
    var missing = W ? LIST.filter(function (r) { return !r.thisWeek; }) : [];
    $('copy-label').textContent = 'Copy names: not checked in (' + missing.length + ')';
    $('copy-missing').disabled = !missing.length;
  }

  function renderChart() {
    var W = DATA.week, n = LIST.length, el = $('chart');
    if (!W || !n) { $('chart-lead').textContent = 'This fills in as weeks go by: the share of pitchers who finished lifts, throwing and arm care each week.'; el.innerHTML = ''; return; }
    var pts = [];
    for (var w = 1; w <= W; w++) {
      var full = 0, any = 0;
      LIST.forEach(function (r) { var c = r.a.checks[w]; if (c) { any++; if (c.done === 3) full++; } });
      pts.push({ w: w, full: full, any: any, pct: Math.round(full / n * 100) });
    }
    var done = pts.filter(function (p) { return p.w < W; });
    var latest = done.length ? done[done.length - 1] : pts[pts.length - 1];
    $('chart-lead').textContent = 'Share of the ' + n + ' pitchers who did all 3 (lifts, throwing plan, arm care) each week. Week ' + latest.w + ': ' + latest.pct + '%' + (W > 1 ? '. This week is still in progress.' : '.');
    var Wd = Math.max(280, Math.round(el.clientWidth || 640)), H = Wd < 500 ? 180 : 220, padL = 36, padB = 26, padT = 20, cols = DATA.weeks, gap = Wd < 500 ? 3 : 6;
    var bw = (Wd - padL) / cols - gap;
    var y = function (pct) { return padT + (H - padT - padB) * (1 - pct / 100); };
    var svg = '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Bar chart of weekly completion, Week 1 to Week ' + W + '">';
    [0, 50, 100].forEach(function (t) {
      svg += '<line x1="' + padL + '" x2="' + Wd + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#E6EBE8" stroke-width="1"/>' +
        '<text x="' + (padL - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="#66726B">' + t + '%</text>';
    });
    pts.forEach(function (p) {
      var slot = padL + (p.w - 1) * (bw + gap) + gap / 2, bwx = Math.min(bw, 44), x = slot + (bw - bwx) / 2, top = y(p.pct), h = Math.max(0, y(0) - top);
      var inProgress = p.w === W;
      var r = Math.min(4, h / 2);
      var path = h > 0 ? 'M' + x + ',' + y(0) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bwx - r) + 'Q' + (x + bwx) + ',' + top + ' ' + (x + bwx) + ',' + (top + r) + 'V' + y(0) + 'Z' : '';
      svg += '<g class="bar" data-tip="Week ' + p.w + (inProgress ? ' (in progress)' : '') + ': ' + p.pct + '% all 3 · ' + p.full + ' of ' + n + ' · ' + p.any + ' checked in" data-x="' + (x + bwx / 2) + '" data-y="' + top + '">' +
        '<rect x="' + (slot - gap / 2) + '" y="' + padT + '" width="' + (bw + gap) + '" height="' + (H - padT - padB) + '" fill="transparent"/>' +
        (path ? '<path d="' + path + '" fill="var(--primary)"' + (inProgress ? ' fill-opacity=".38"' : '') + '/>' : '') + '</g>';
      svg += '<text x="' + (x + bwx / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#66726B">' + p.w + '</text>';
    });
    if (latest) {
      var lx = padL + (latest.w - 1) * (bw + gap) + gap / 2 + bw / 2;
      svg += '<text x="' + lx + '" y="' + (y(latest.pct) - 6) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#17201A">' + latest.pct + '%</text>';
    }
    svg += '</svg><div class="tip" id="tip" hidden></div>';
    el.innerHTML = svg;
    var tip = $('tip'), s = el.querySelector('svg');
    el.querySelectorAll('.bar').forEach(function (g) {
      var show = function () {
        var k = 1;
        tip.textContent = g.getAttribute('data-tip'); tip.hidden = false;
        tip.style.left = (Number(g.getAttribute('data-x')) * k) + 'px';
        tip.style.top = (Number(g.getAttribute('data-y')) * k) + 'px';
      };
      g.addEventListener('mouseenter', show); g.addEventListener('touchstart', show, { passive: true });
      g.addEventListener('mouseleave', function () { tip.hidden = true; });
    });
  }

  // ---------- pitcher panel ----------
  function openPitcher(i) {
    var r = LIST[i]; if (!r) return;
    var a = r.a, p = r.p, W = DATA.week;
    lastFocus = document.activeElement;
    var facts = function (pairs) { return '<dl class="facts">' + pairs.filter(function (x) { return x[1]; }).map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>'; };
    var cells = '';
    for (var w = 1; w <= DATA.weeks; w++) {
      var c = a.checks[w], flagged = a.arm.filter(function (e) { return e.week === w; });
      var worst = flagged.some(function (e) { return e.level === 'PAIN'; }) ? 'red' : flagged.length ? 'orange' : '';
      var cls = 'cell' + (c ? (c.done === 3 ? ' full' : ' part') : '') + (worst ? ' flag-' + worst : '') + (W && w > W ? ' future' : '');
      var txt = c ? (c.done === 3 ? '✓' : c.done + '/3') : (W && w > W ? '' : '–');
      cells += '<div class="' + cls + '" title="Week ' + w + (c ? ': lifts ' + (c.lifts ? 'yes' : 'no') + ', throwing ' + (c.throwing ? 'yes' : 'no') + ', arm care ' + (c.armcare ? 'yes' : 'no') : '') + (worst ? ' · ' + (worst === 'red' ? 'pain' : 'soreness') + ' reported' : '') + '">W' + w + '<b>' + txt + '</b></div>';
    }
    var timeline = a.arm.length ? '<ul class="timeline">' + a.arm.map(function (e) {
      return '<li><span class="d">' + esc(shortDate(e.at)) + (e.week ? '<br>Week ' + e.week : '') + '</span><span>' + (e.level === 'PAIN' ? '<span class="pill s-red">' + ICON.bang + 'Pain</span>' : '<span class="pill s-orange">' + ICON.eye + 'Sore</span>') +
        (e.where ? ' <strong>' + esc(e.where) + '</strong>' : '') + (e.note ? '<br>"' + esc(e.note) + '"' : '') + '</span></li>';
    }).join('') + '</ul>' : '<p class="meta" style="margin:0">No soreness or pain reported.</p>';
    var profile = p ? facts([
      ['Grade', p.grade], ['Throws', p.throws], ['Last spring', p.level], ['Role', p.role], ['Also plays', p.positions],
      ['Size', [p.height, p.weight ? p.weight + ' lbs' : ''].filter(Boolean).join(', ')],
      ['Pitches', p.pitches], ['Best pitch', p.best], ['Fastball', p.velo],
      ['Top goals', p.goals], ['New pitch', p.newPitch], ['#1 goal', p.goalText], ['College', p.college],
      ['Worked last year', p.worked], ["Didn't work", p.didnt],
      ['Arm, last 12 mo', p.arm + (p.armWhere ? ' (' + p.armWhere + ')' : '')], ['Hurts right now', p.painNow],
      ['Winter sports', p.sports], ['Lifts at', p.gym], ['Days / week', p.days], ['Private coach', p.privateCoach], ['Sleep', p.sleep], ['Notes', p.notes]
    ]) + '<p class="meta" style="margin:10px 0 0">Profile updated ' + esc(shortDate(p.at)) + '</p>' : '<p class="meta" style="margin:0">No pitcher profile yet. Ask them to fill it out from the card on the app\'s Phases tab.</p>';
    $('panel').innerHTML =
      '<div class="panel-head"><div><h3 id="p-name">' + esc(r.name) + '</h3><div style="margin-top:6px">' + pill(r.status) + '</div></div>' +
      '<button type="button" class="btn btn-light" id="p-close" aria-label="Close">' + ICON.close + '</button></div>' +
      '<div class="panel-body">' +
      (r.reasons.length ? '<div class="card"><h4>Why they\'re flagged</h4><ul style="margin:0;padding-left:18px">' + r.reasons.map(function (x) { return '<li>' + esc(x.what) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="card"><h4>Season so far · ' + r.weeksDone + ' of ' + Math.max(W, 0) + ' weeks checked in · streak ' + r.streak + '</h4><div class="grid16">' + cells + '</div>' +
      '<div class="legend"><span><i class="sw" style="background:var(--green-bg)"></i>All 3 done</span><span><i class="sw" style="background:#FFF8DB"></i>Some done</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--orange)"></i>Soreness</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--red)"></i>Pain</span></div></div>' +
      '<div class="card"><h4>Arm reports</h4>' + timeline + '</div>' +
      '<div class="card"><h4>Pitcher profile</h4>' + profile + '</div>' +
      '</div>';
    $('scrim').hidden = false;
    document.body.style.overflow = 'hidden';
    $('p-close').focus();
  }
  function closePitcher() {
    $('scrim').hidden = true; document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) { openPitcher(Number(o.getAttribute('data-open'))); return; }
    if (e.target.closest('#p-close') || e.target === $('scrim')) closePitcher();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('scrim').hidden) closePitcher();
    if (e.key === 'Tab' && !$('scrim').hidden) {
      var f = $('panel').querySelectorAll('button, a[href]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; renderRoster(); });
  ['grade', 'role', 'goal'].forEach(function (k) { $('f-' + k).addEventListener('change', function (e) { state[k] = e.target.value; renderRoster(); }); });

  $('copy-missing').addEventListener('click', function () {
    var names = LIST.filter(function (r) { return DATA.week && !r.thisWeek; }).map(function (r) { return r.name; });
    var text = names.join(', ');
    var box = $('copy-box'), toast = $('copy-toast');
    var fallback = function () { box.hidden = false; box.value = text; box.focus(); box.select(); toast.textContent = 'Names selected. Copy them from the box.'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast.textContent = 'Copied ' + names.length + ' name' + (names.length === 1 ? '' : 's') + '.'; box.hidden = true; }, fallback);
      else fallback();
    } catch (err) { fallback(); }
  });

  $('refresh').addEventListener('click', function () {
    var btn = this, label = btn.querySelector('span');
    btn.disabled = true; label.textContent = 'Refreshing…';
    load(true).then(function () { btn.disabled = false; label.textContent = 'Refresh'; }, function () { btn.disabled = false; label.textContent = 'Couldn\'t refresh. Try again'; });
  });
  $('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = $('code').value.trim().replace(/\s+/g, '');
    if (!k) { $('gate-err').textContent = 'Enter the code from the Coach Access tab.'; return; }
    $('gate-err').textContent = ''; setKey(k); load();
  });
  $('forget').addEventListener('click', function () { setKey(''); DATA = null; $('code').value = ''; show(['gate']); });
  // A link like coach.html#key=abc123 fills in the code, then removes it from the address bar
  function keyFromLink() {
    var m = /[#&]key=([A-Za-z0-9]+)/.exec(location.hash || '');
    if (!m) return false;
    setKey(m[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return true;
  }
  keyFromLink();
  window.addEventListener('hashchange', function () { if (keyFromLink()) load(); });

  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(renderChart, 150); });
  load();
})();
</script>
</body>
